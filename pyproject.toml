[build-system]
requires = ["uv_build>=0.6,<0.12"]
build-backend = "uv_build"

[project]
name = "moops"
version = "0.11.5"
description = "Write Marimo notebooks that also work as CLI scripts, with unified UI controls"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Yair Chuchem" },
]
keywords = ["marimo", "notebooks", "cli", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "marimo>=0.23.1",
    "hypothesis",
]

[project.urls]
Homepage = "https://github.com/yairchu/moops"
Repository = "https://github.com/yairchu/moops"
Issues = "https://github.com/yairchu/moops/issues"

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "vulture>=2.16",
    "pylint>=3.0",
    "pymarkdownlnt>=0.9.37",
    "matplotlib>=3.10.9",
    "xarray>=2025.6.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
extraPaths = ["src", ".", "examples"]

[tool.uv.sources]
moops = { workspace = true }

[tool.ruff.lint]
select = ["E", "F", "I", "B", "RUF", "C4", "SIM", "N", "Q", "TID", "UP", "PT", "RET"]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["F401", "F841", "B018"]
