[build-system]
requires = ["uv_build>=0.6,<0.12"]
build-backend = "uv_build"

[project]
name = "moops"
version = "0.15.0"
description = "Write Marimo notebooks that also work as CLI scripts, with unified UI controls"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Yair Chuchem" },
]
keywords = ["marimo", "notebooks", "cli", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "marimo-base>=0.23.15",
    "rich>=15.0.0",
]

[project.optional-dependencies]
# Interface.strategy() builds a Hypothesis strategy; only needed for testing.
test = ["hypothesis"]
# Group.table() uses pandas.to_markdown(), which requires tabulate for CLI output.
table = ["tabulate>=0.10.0"]
# Group.progress_bar() and Group.spinner() use tqdm on the CLI when installed.
status = ["tqdm>=4.67.1"]

[project.urls]
Homepage = "https://github.com/yairchu/moops"
Repository = "https://github.com/yairchu/moops"
Issues = "https://github.com/yairchu/moops/issues"
"Agent skill" = "https://github.com/yairchu/moops/tree/main/skills/migrate-marimo-to-moops"

[dependency-groups]
dev = [
    "hypothesis",
    "ruff>=0.1.0",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "vulture>=2.16",
    "pylint>=3.0",
    "pymarkdownlnt>=0.9.37",
    "matplotlib>=3.10.9",
    "tabulate>=0.10.0",
    "tqdm>=4.67.1",
    "xarray>=2025.6.1",
    "marimo>=0.23.15",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
filterwarnings = [
    "error",
]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
extraPaths = ["src", ".", "examples"]

[tool.uv.sources]
moops = { workspace = true }

[tool.ruff.lint]
select = ["E", "F", "I", "B", "RUF", "C4", "SIM", "N", "Q", "TID", "UP", "PT", "RET"]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["F401", "F841", "B018"]
